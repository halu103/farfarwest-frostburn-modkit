name: Validate source project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate source, lock, and PowerShell syntax
        shell: pwsh
        run: ./tools/Test-Project.ps1
